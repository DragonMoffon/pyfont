
[project]
name = "pyfont"
version = "0.0.1"
readme = "README.md"
authors = [
    { name = "DragonMoffon" },
]
description = "Zero-dependency TTF parsing."

requires-python = ">= 3.13"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Fonts",
    "Operating System :: OS Independent",

    # Match our requires-python value above
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Derived from pyglet's code, zero hard run-time deps.
dependencies = [
]


[project.optional-dependencies]
dev = [
    "pytest~=9.0.0",
    "flake8==6.0.0",
    "mypy==1.14.1",
    "pylint==3.2.7",
    "ruff==0.11.2",
    "black==24.8.0"
]
viewer = [
  "textual==6.7.1",
  "unicodedataplus==16.0.0.post1"
]

[tool.setuptools]
packages = ['tests', 'fnt']

# Tell ruff to do typical things (more to come)
[tool.ruff.lint]
exclude = ["venv*/*", ".venv*/*", "build/*", "doc/*", ".github", "tests"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"

